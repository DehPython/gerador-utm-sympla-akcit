server {
    listen 8080;
    server_name _;
    root /site;
    index index.html;

    server_tokens off;

    # ---- cabeçalhos de segurança ----
    # A página não injeta HTML de ninguém (todo texto entra por textContent) e
    # os scripts são todos locais. A CSP abaixo reflete isso: só o próprio
    # domínio, mais as fontes do Google, e nada além disso.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Nada aqui é escrito pela web.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # A lista de pessoas muda a cada sincronização: não pode ficar em cache.
    location = /src/dados.js {
        alias /dados/dados.js;
        default_type "text/javascript";
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Revalidar sempre, em vez de cachear por tempo fixo. Com max-age longo, um
    # deploy novo só chegaria ao navegador quando o prazo vencesse — e a pessoa
    # ficaria com a versão velha sem saber. O nginx responde 304 quando o
    # arquivo não mudou, então o custo é um cabeçalho, não o arquivo inteiro.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript text/plain;
    gzip_min_length 512;
}
